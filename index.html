<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diwali Party Game 🪔</title>
<style>
  :root{
    --bg1:#2b0a3d; --bg2:#5a1459; --gold:#ffc94a; --orange:#ff7a1a; --card:#fff6e0; --ink:#3a1030;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; font-family:"Segoe UI",system-ui,sans-serif; color:#fff;
    background:radial-gradient(circle at 20% 0%,var(--bg2),var(--bg1) 60%);
    padding:20px;
  }
  h1{text-align:center;margin:6px 0 4px;color:var(--gold);letter-spacing:1px}
  .sub{text-align:center;opacity:.85;margin-bottom:8px}
  .progress{text-align:center;font-size:13px;opacity:.7;margin-bottom:18px;letter-spacing:1px;text-transform:uppercase}
  .wrap{max-width:1100px;margin:0 auto}
  .hidden{display:none!important}
  .center{text-align:center}
  .msg{margin:14px 0;text-align:center;min-height:24px;color:#ffb0b0;font-weight:600}

  button{
    background:linear-gradient(180deg,var(--gold),var(--orange));color:#3a1030;border:0;
    padding:12px 26px;font-size:17px;font-weight:700;border-radius:30px;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.35)
  }
  button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  button.ghost{background:transparent;color:var(--gold);border:2px solid var(--gold);box-shadow:none;padding:8px 18px;font-size:14px}

  /* Hand-off gate */
  .gate{max-width:480px;margin:40px auto;text-align:center;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,201,74,.35);border-radius:20px;padding:40px 24px}
  .gate .who{font-size:34px;font-weight:800;color:var(--gold);margin:6px 0 2px}
  .gate .note{opacity:.8;margin:6px 0 26px}
  .gate .diya{font-size:44px}

  /* Pick numbers */
  .ngrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:440px;margin:18px auto}
  .ntile{aspect-ratio:1;border-radius:14px;border:2px solid var(--gold);background:rgba(255,255,255,.06);
    color:var(--gold);font-size:22px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform .08s}
  .ntile:active{transform:scale(.92)}
  .ntile.sel{background:var(--gold);color:var(--ink);box-shadow:0 0 0 3px rgba(255,201,74,.35)}
  .ntile.taken{opacity:.22;border-color:#888;color:#888;cursor:not-allowed;pointer-events:none;background:transparent}
  .counter{text-align:center;font-size:16px;margin:4px 0 16px}
  .counter b{color:var(--gold)}

  /* Decide / eliminate */
  .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;max-width:820px;margin:10px auto}
  .schoice{position:relative;background:var(--card);color:var(--ink);border:3px solid var(--orange);border-radius:16px;
    padding:16px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4);transition:transform .1s}
  .schoice:active{transform:scale(.98)}
  .schoice .tag{font-size:12px;font-weight:700;color:#b3430c;letter-spacing:1px}
  .schoice h4{margin:6px 0;font-size:17px}
  .schoice p{margin:6px 0 0;font-size:14.5px;line-height:1.4}
  .schoice.kill{border-color:#ff4d4d;opacity:.6}
  .schoice.kill h4,.schoice.kill p{text-decoration:line-through}
  .schoice .badge{position:absolute;top:10px;right:10px;background:#ff4d4d;color:#fff;font-size:11px;font-weight:800;
    padding:4px 10px;border-radius:20px;display:none}
  .schoice.kill .badge{display:block}

  /* Reveal */
  .bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:16px}
  .filters{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:6px 14px;border-radius:20px;border:1px solid var(--gold);cursor:pointer;font-size:14px;color:var(--gold);user-select:none}
  .chip.on{background:var(--gold);color:var(--ink);font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .flip{perspective:900px;height:320px;cursor:pointer}
  .inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
  .flip.open .inner{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:16px;
    display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
    box-shadow:0 6px 18px rgba(0,0,0,.4)
  }
  .front{background:linear-gradient(145deg,#8a1f5c,#d9432c);border:3px solid var(--gold)}
  .front .no{font-size:64px;font-weight:800;color:var(--gold);line-height:1}
  .front .own{margin-top:10px;font-size:20px;background:rgba(0,0,0,.28);padding:4px 16px;border-radius:20px}
  .front .tap{margin-top:12px;font-size:12px;opacity:.8}
  .back{background:var(--card);color:var(--ink);transform:rotateY(180deg);border:3px solid var(--orange);overflow:auto;justify-content:flex-start;align-items:flex-start;text-align:left}
  .back .tag{font-size:12px;font-weight:700;color:#b3430c;letter-spacing:1px}
  .back h4{margin:6px 0;font-size:17px}
  .back p{margin:6px 0 0;font-size:14.5px;line-height:1.4}
  .count{font-size:15px}
  .diya{font-size:28px}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="diya">🪔</span> Diwali Party Game <span class="diya">🪔</span></h1>
  <div class="sub" id="sub">Pass the phone around — one player at a time</div>
  <div class="progress" id="progress"></div>

  <!-- HAND-OFF GATE -->
  <section id="gate" class="hidden">
    <div class="gate">
      <div class="diya">🪔</div>
      <div>It's</div>
      <div class="who" id="gateWho">—</div>
      <div class="note" id="gateNote">Pass the phone to them, then begin.</div>
      <button id="gateBtn">I'm ready — start my turn</button>
    </div>
  </section>

  <!-- PICK NUMBERS -->
  <section id="pick" class="hidden">
    <div class="center" style="font-size:20px;font-weight:700;color:var(--gold)" id="pickWho">—</div>
    <div class="sub">Pick any <b>4</b> numbers (1–20). Faded numbers are already taken.</div>
    <div class="ngrid" id="ngrid"></div>
    <div class="counter"><b id="selCount">0</b> / 4 selected</div>
    <div class="center"><button id="lockBtn" disabled>Lock in my picks →</button></div>
  </section>

  <!-- DECIDE / ELIMINATE -->
  <section id="decide" class="hidden">
    <div class="center" style="font-size:20px;font-weight:700;color:var(--gold)" id="decideWho">—</div>
    <div class="sub">Here are your 4 scenarios. Tap the <b>one</b> you want to eliminate.</div>
    <div class="choices" id="choices"></div>
    <div class="msg" id="decideMsg"></div>
    <div class="center"><button id="confirmBtn" disabled>Confirm &amp; pass on →</button></div>
  </section>

  <!-- REVEAL -->
  <section id="reveal" class="hidden">
    <div class="bar">
      <div class="filters" id="filters"></div>
      <div class="count" id="count"></div>
      <div>
        <button class="ghost" id="flipAll">Flip all</button>
        <button class="ghost" id="restartBtn">↺ Restart</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<script>
/* ======= YOUR 20 SCENARIOS (number = position) ======= */
const SCENARIOS = [
  /* 1 */  {t:"Trip Choice", d:"Would you rather go on a small trip with your partner, or go to a match, concert or fun trip with your friends?"},
  /* 2 */  {t:"Friend's Bad Habit", d:"Your friend is falling into a bad habit, but he doesn't take criticism well. His girlfriend is pressuring you to talk to him. What would you do?"},
  /* 3 */  {t:"Sandpaper or Hot Sauce", d:"Would you rather use sandpaper as toilet paper, or hot sauce as eye drops?"},
  /* 4 */  {t:"The Cook", d:"You have a cook who makes amazing food, and your family depends on him. He doesn't follow your wife's orders, though he never disrespects her, and she thinks it's a problem. Would you fire him or not? (Male players only.)"},
  /* 5 */  {t:"The Dream Move", d:"You are in a healthy relationship, but you get the opportunity of a lifetime to move to another city or country for your dream job. Your partner is completely against moving and doesn't want a long-distance relationship. What would you do?"},
  /* 6 */  {t:"The Party Flirt", d:"At a party, your friend (a guy) is openly flirting with another girl while his girlfriend is not there. She is also your friend. Would you tell her or not, and how?"},
  /* 7 */  {t:"The Casting Offer", d:"Your partner is a normal person working in a corporate job. A casting director randomly picked them and offered ₹15 lakh for a scene that involves a kiss. Your partner has said no. Would you let them do it or not?"},
  /* 8 */  {t:"Short on Time", d:"You are short on time and want to have a fun time. Which one position would you go for?"},
  /* 9 */  {t:"Partner's Ex", d:"You accidentally find out that your partner is talking to their ex, but you don't know the full context. What would you do?"},
  /* 10 */ {t:"Family Match", d:"Would you rather date someone who is rich, good-looking and funny but doesn't get along with your family, or someone who is great with your family, funny and rich but not good-looking?"},
  /* 11 */ {t:"Crush's Traits", d:"Your crush has mentioned a few things they like in a partner, and some of those traits are not you. You genuinely like them, and they seem to like you back. Would you change yourself if those traits were dealbreakers for them?"},
  /* 12 */ {t:"Say It All", d:"Would you rather say everything you think, or never speak again?"},
  /* 13 */ {t:"Nobody Likes Her", d:"You have a loving, caring girlfriend and everything is good between you, but none of your family or friends like her at all. Nobody is giving you an honest answer. Would you dump her, or end your relationships with your friends and family?"},
  /* 14 */ {t:"The Third Person", d:"Your partner wants to invite someone else into your intimate moments. Would you be okay with it?"},
  /* 15 */ {t:"Matchmaker", d:"Pick one person from the current group and one person from the outside world who you think would go well together. Give a reason as well."},
  /* 16 */ {t:"The Ex Returns", d:"Your ex, with whom you had a great relationship, is trying to get back together. Meanwhile, you have just started a new relationship, which is not perfect. What would you do?"},
  /* 17 */ {t:"Blackmail?", d:"You recently joined a company, and your manager, a very influential person, has been bullying you for a while. Now you have found out a secret about them. Would you blackmail them?"},
  /* 18 */ {t:"Celebrity Crush", d:"You get the chance to spend some time with your celebrity crush, who is up for anything. Name the celebrity and the one thing you would do."},
  /* 19 */ {t:"Angry Partner", d:"At a function, a relative says something to your partner that they didn't like. You think it's a small issue, but your partner is very angry. What would you do at the function?"},
  /* 20 */ {t:"Looks vs Bedroom", d:"Would you rather date someone who is good-looking and funny but not great in bed, or someone who is great in bed but slightly boring and average-looking?"}
];
const PLAYERS = ["Anish","Atman","Aniket","Rucha","Savani"];
const N = SCENARIOS.length;
/* ===================================================================== */

const $ = s => document.querySelector(s);

let cur = 0;            // current player index
const picks = {};       // i -> [nums]
const elim = {};        // i -> eliminated num
let selected = [];      // working selection during pick
let chosenElim = null;  // working choice during decide

const show = id => ["gate","pick","decide","reveal"].forEach(s=>$("#"+s).classList.toggle("hidden", s!==id));

function takenNumbers(){
  const t = new Set();
  Object.values(picks).forEach(arr => arr.forEach(n => t.add(n)));
  return t;
}

function setProgress(){
  $("#progress").textContent = cur < PLAYERS.length
    ? `Player ${cur+1} of ${PLAYERS.length}`
    : `All ${PLAYERS.length} done`;
}

/* ---------- Hand-off gate ---------- */
function startTurn(i){
  cur = i;
  setProgress();
  $("#gateWho").textContent = PLAYERS[i];
  $("#gateNote").textContent = i===0
    ? "You're up first. Tap below when you're ready."
    : "Pass the phone to them, then tap below.";
  $("#sub").textContent = "Pass the phone around — one player at a time";
  show("gate");
}
$("#gateBtn").onclick = () => showPick();

/* ---------- Pick numbers ---------- */
function showPick(){
  selected = [];
  chosenElim = null;
  $("#pickWho").textContent = PLAYERS[cur] + "'s picks";
  $("#selCount").textContent = "0";
  $("#lockBtn").disabled = true;
  const taken = takenNumbers();
  const g = $("#ngrid"); g.innerHTML = "";
  for(let n=1;n<=N;n++){
    const b = document.createElement("div");
    b.className = "ntile" + (taken.has(n) ? " taken" : "");
    b.textContent = n;
    if(!taken.has(n)){
      b.onclick = () => togglePick(n, b);
    }
    g.appendChild(b);
  }
  show("pick");
}
function togglePick(n, el){
  const idx = selected.indexOf(n);
  if(idx>=0){ selected.splice(idx,1); el.classList.remove("sel"); }
  else {
    if(selected.length>=4) return;
    selected.push(n); el.classList.add("sel");
  }
  $("#selCount").textContent = selected.length;
  $("#lockBtn").disabled = selected.length!==4;
}
$("#lockBtn").onclick = () => {
  if(selected.length!==4) return;
  picks[cur] = [...selected].sort((a,b)=>a-b);
  showDecide();
};

/* ---------- Decide / eliminate ---------- */
function showDecide(){
  chosenElim = null;
  $("#decideWho").textContent = PLAYERS[cur] + ", your scenarios";
  $("#decideMsg").textContent = "";
  $("#confirmBtn").disabled = true;
  const c = $("#choices"); c.innerHTML = "";
  picks[cur].forEach(n=>{
    const s = SCENARIOS[n-1];
    const el = document.createElement("div");
    el.className = "schoice";
    el.innerHTML = `
      <span class="badge">ELIMINATED</span>
      <div class="tag">#${n}</div>
      <h4>${s.t}</h4>
      <p>${s.d}</p>`;
    el.onclick = () => {
      chosenElim = n;
      [...c.children].forEach(ch=>ch.classList.remove("kill"));
      el.classList.add("kill");
      $("#confirmBtn").disabled = false;
      $("#decideMsg").textContent = "";
    };
    c.appendChild(el);
  });
  show("decide");
}
$("#confirmBtn").onclick = () => {
  if(chosenElim===null){ $("#decideMsg").textContent = "Tap a scenario to eliminate first."; return; }
  elim[cur] = chosenElim;
  if(cur < PLAYERS.length-1){ startTurn(cur+1); }
  else { buildReveal(); }
};

/* ---------- Reveal ---------- */
let filter = "All";
function buildReveal(){
  setProgress();
  $("#sub").textContent = "Everyone's scenarios — click a card to reveal!";
  $("#progress").textContent = "The reveal";
  filter = "All";
  renderFilters();
  renderGrid();
  show("reveal");
}
function renderFilters(){
  const f = $("#filters"); f.innerHTML="";
  ["All",...PLAYERS].forEach(n=>{
    const c = document.createElement("div");
    c.className="chip"+(filter===n?" on":"");
    c.textContent=n;
    c.onclick=()=>{filter=n;renderFilters();renderGrid();};
    f.appendChild(c);
  });
}
function renderGrid(){
  const g = $("#grid"); g.innerHTML="";
  const cards = [];
  PLAYERS.forEach((p,i)=>{
    (picks[i]||[]).filter(n=>n!==elim[i]).forEach(n=>cards.push({n,owner:p}));
  });
  cards.sort((a,b)=>a.n-b.n);
  cards.filter(c=>filter==="All"||c.owner===filter).forEach(c=>{
    const s = SCENARIOS[c.n-1];
    const el = document.createElement("div");
    el.className="flip";
    el.innerHTML = `
      <div class="inner">
        <div class="face front">
          <div class="no">#${c.n}</div>
          <div class="own">${c.owner}</div>
          <div class="tap">tap to reveal</div>
        </div>
        <div class="face back">
          <div class="tag">#${c.n} · ${c.owner.toUpperCase()}</div>
          <h4>${s.t}</h4>
          <p>${s.d}</p>
        </div>
      </div>`;
    el.onclick=()=>{el.classList.toggle("open");updateCount();};
    g.appendChild(el);
  });
  updateCount();
}
function updateCount(){
  const all = document.querySelectorAll(".flip");
  const open = document.querySelectorAll(".flip.open");
  $("#count").textContent = `${open.length} / ${all.length} revealed`;
}
$("#flipAll").onclick = () => {
  const all = [...document.querySelectorAll(".flip")];
  const anyClosed = all.some(x=>!x.classList.contains("open"));
  all.forEach(x=>x.classList.toggle("open",anyClosed));
  updateCount();
};
$("#restartBtn").onclick = () => {
  Object.keys(picks).forEach(k=>delete picks[k]);
  Object.keys(elim).forEach(k=>delete elim[k]);
  startTurn(0);
};

/* ---------- Boot ---------- */
startTurn(0);
</script>
</body>
</html>
